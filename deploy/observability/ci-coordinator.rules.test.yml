rule_files:
  - ci-coordinator.rules.yml
evaluation_interval: 30s

tests:
  - name: detail cleanup storage failures warn after persistence and clear after recovery
    interval: 1m
    input_series:
      - series: 'ci_coordinator_maintenance_operations_total{job="ci-coordinator",instance="a:3000",operation="ci_history_detail_cleanup",result="failed"}'
        values: '0+1x12 12+0x48'
    alert_rule_test:
      - eval_time: 2m
        alertname: CIHistoryDetailCleanupFailuresObserved
        exp_alerts: []
      - eval_time: 10m
        alertname: CIHistoryDetailCleanupFailuresObserved
        exp_alerts: &detail-cleanup-warning
          - exp_labels:
              service: ci-coordinator
              severity: warning
            exp_annotations:
              summary: Historical detail expiry repeatedly failed to complete
              runbook: docs/how-to/operate-production-observability.md
      - eval_time: 50m
        alertname: CIHistoryDetailCleanupFailuresObserved
        exp_alerts: []
  - name: detail cleanup timeouts independently warn
    interval: 1m
    input_series:
      - series: 'ci_coordinator_maintenance_operations_total{job="ci-coordinator",instance="a:3000",operation="ci_history_detail_cleanup",result="timed_out"}'
        values: '0+1x12'
    alert_rule_test:
      - eval_time: 2m
        alertname: CIHistoryDetailCleanupFailuresObserved
        exp_alerts: []
      - eval_time: 10m
        alertname: CIHistoryDetailCleanupFailuresObserved
        exp_alerts: *detail-cleanup-warning
  - name: cleanup success foreign targets unrelated operations and counter resets do not warn
    interval: 1m
    input_series:
      - series: 'ci_coordinator_maintenance_operations_total{job="ci-coordinator",instance="a:3000",operation="ci_history_detail_cleanup",result="succeeded"}'
        values: '0+10x40'
      - series: 'ci_coordinator_maintenance_operations_total{job="foreign",instance="a:3000",operation="ci_history_detail_cleanup",result="failed"}'
        values: '0+10x40'
      - series: 'ci_coordinator_maintenance_operations_total{job="ci-coordinator",instance="a:3000",operation="ci_economics_expiry",result="failed"}'
        values: '0+10x40'
      - series: 'ci_coordinator_maintenance_operations_total{job="ci-coordinator",instance="a:3000",operation="ci_history_detail_cleanup",result="failed"}'
        values: '1000+0x5 0+0x34'
    alert_rule_test:
      - eval_time: 10m
        alertname: CIHistoryDetailCleanupFailuresObserved
        exp_alerts: []
      - eval_time: 35m
        alertname: CIHistoryDetailCleanupFailuresObserved
        exp_alerts: []
  - name: a stopped archive worker is attributed and resolves when the lane returns
    interval: 1m
    input_series:
      - series: 'up{job="ci-coordinator",instance="a:3000"}'
        values: '1+0x5'
      - series: 'ci_coordinator_ci_history_worker_running{job="ci-coordinator",instance="a:3000",lane="backfill"}'
        values: '0 0 0 0 1 1'
      - series: 'ci_coordinator_ci_history_worker_running{job="ci-coordinator",instance="a:3000",lane="discovery"}'
        values: '0 0 0 0 1 1'
      - series: 'ci_coordinator_ci_history_worker_running{job="ci-coordinator",instance="a:3000",lane="recent"}'
        values: '0 0 0 0 1 1'
      - series: 'ci_coordinator_ci_history_worker_running{job="ci-coordinator",instance="a:3000",lane="repair"}'
        values: '0 0 0 0 1 1'
    alert_rule_test:
      - eval_time: 1m
        alertname: CIHistoryWorkerStopped
        exp_alerts: []
      - eval_time: 3m
        alertname: CIHistoryWorkerStopped
        exp_alerts:
          - exp_labels:
              job: ci-coordinator
              instance: a:3000
              lane: backfill
              service: ci-coordinator
              severity: warning
            exp_annotations: &history-worker-stopped-annotations
              summary: An archive worker is not running
              runbook: docs/how-to/operate-production-observability.md
          - exp_labels:
              job: ci-coordinator
              instance: a:3000
              lane: discovery
              service: ci-coordinator
              severity: warning
            exp_annotations: *history-worker-stopped-annotations
          - exp_labels:
              job: ci-coordinator
              instance: a:3000
              lane: recent
              service: ci-coordinator
              severity: warning
            exp_annotations: *history-worker-stopped-annotations
          - exp_labels:
              job: ci-coordinator
              instance: a:3000
              lane: repair
              service: ci-coordinator
              severity: warning
            exp_annotations: *history-worker-stopped-annotations
      - eval_time: 5m
        alertname: CIHistoryWorkerStopped
        exp_alerts: []

  - name: healthy unknown foreign and unavailable worker observations do not fire
    interval: 1m
    input_series:
      - series: 'up{job="ci-coordinator",instance="a:3000"}'
        values: '1+0x5'
      - series: 'up{job="ci-coordinator",instance="b:3000"}'
        values: '0+0x5'
      - series: 'up{job="foreign",instance="c:3000"}'
        values: '1+0x5'
      - series: 'ci_coordinator_ci_history_worker_running{job="ci-coordinator",instance="a:3000",lane="backfill"}'
        values: '1+0x5'
      - series: 'ci_coordinator_ci_history_worker_running{job="ci-coordinator",instance="a:3000",lane="other"}'
        values: '0+0x5'
      - series: 'ci_coordinator_ci_history_worker_running{job="ci-coordinator",instance="b:3000",lane="backfill"}'
        values: '0+0x5'
      - series: 'ci_coordinator_ci_history_worker_running{job="foreign",instance="c:3000",lane="backfill"}'
        values: '0+0x5'
    alert_rule_test:
      - eval_time: 5m
        alertname: CIHistoryWorkerStopped
        exp_alerts: []

  - name: absent worker series do not assert that history workers are configured
    interval: 1m
    input_series:
      - series: 'up{job="ci-coordinator",instance="a:3000"}'
        values: '1+0x5'
    alert_rule_test:
      - eval_time: 5m
        alertname: CIHistoryWorkerStopped
        exp_alerts: []

  - name: an observed webhook failure signals possible delivery loss
    interval: 1m
    input_series:
      - series: 'ci_coordinator_http_requests_total{job="ci-coordinator",method="POST",route="/webhooks/github",status_class="5xx"}'
        values: '0+1x15'
    alert_rule_test:
      - eval_time: 5m
        alertname: CIWebhookDeliveryUnavailable
        exp_alerts:
          - exp_labels: &webhook_labels
              service: ci-coordinator
              severity: warning
            exp_annotations: &webhook_annotations
              summary: A GitHub webhook delivery needs recovery investigation
              runbook: docs/how-to/recover-webhook-deliveries.md

  - name: each unrelated selector and zero growth stay outside delivery recovery
    interval: 1m
    input_series:
      - series: 'ci_coordinator_http_requests_total{job="unrelated",method="POST",route="/webhooks/github",status_class="5xx"}'
        values: '0+1x15'
      - series: 'ci_coordinator_http_requests_total{job="ci-coordinator",method="GET",route="/webhooks/github",status_class="5xx"}'
        values: '0+1x15'
      - series: 'ci_coordinator_http_requests_total{job="ci-coordinator",method="POST",route="/api/v1/dynamic-ci/plan",status_class="5xx"}'
        values: '0+1x15'
      - series: 'ci_coordinator_http_requests_total{job="ci-coordinator",method="POST",route="/webhooks/github",status_class="2xx"}'
        values: '0+1x15'
      - series: 'ci_coordinator_http_requests_total{job="ci-coordinator",method="POST",route="/webhooks/github",status_class="5xx"}'
        values: '7+0x15'
    alert_rule_test:
      - eval_time: 5m
        alertname: CIWebhookDeliveryUnavailable
        exp_alerts: []

  - name: absent webhook telemetry does not fabricate observed failure
    interval: 1m
    alert_rule_test:
      - eval_time: 5m
        alertname: CIWebhookDeliveryUnavailable
        exp_alerts: []

  - name: a counter reset alone is not a new failed delivery
    interval: 1m
    input_series:
      - series: 'ci_coordinator_http_requests_total{job="ci-coordinator",method="POST",route="/webhooks/github",status_class="5xx"}'
        values: '7 7 0+0x13'
    alert_rule_test:
      - eval_time: 5m
        alertname: CIWebhookDeliveryUnavailable
        exp_alerts: []

  - name: an isolated webhook failure resolves after the bounded hold
    interval: 1m
    input_series:
      - series: 'ci_coordinator_http_requests_total{job="ci-coordinator",method="POST",route="/webhooks/github",status_class="5xx"}'
        values: '0 1+0x15'
    alert_rule_test:
      - eval_time: 4m
        alertname: CIWebhookDeliveryUnavailable
        exp_alerts:
          - exp_labels: *webhook_labels
            exp_annotations: *webhook_annotations
      - eval_time: 8m
        alertname: CIWebhookDeliveryUnavailable
        exp_alerts:
          - exp_labels: *webhook_labels
            exp_annotations: *webhook_annotations
      - eval_time: 11m
        alertname: CIWebhookDeliveryUnavailable
        exp_alerts: []

  - name: healthy replicas do not fire telemetry alerts
    interval: 1m
    input_series:
      - series: 'up{job="ci-coordinator",instance="a:3000"}'
        values: '1+0x15'
      - series: 'ci_coordinator_ready{job="ci-coordinator",instance="a:3000"}'
        values: '1+0x15'
      - series: 'up{job="ci-coordinator",instance="b:3000"}'
        values: '1+0x15'
      - series: 'ci_coordinator_ready{job="ci-coordinator",instance="b:3000"}'
        values: '0+0x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: CICoordinatorTargetsAbsent
        exp_alerts: []
      - eval_time: 10m
        alertname: CICoordinatorScrapeFailed
        exp_alerts: []
      - eval_time: 10m
        alertname: CICoordinatorReadinessTelemetryAbsent
        exp_alerts: []

  - name: an unrelated job cannot conceal missing coordinator targets
    interval: 1m
    input_series:
      - series: 'up{job="unrelated",instance="a:3000"}'
        values: '1+0x15'
    alert_rule_test:
      - eval_time: 4m30s
        alertname: CICoordinatorTargetsAbsent
        exp_alerts: []
      - eval_time: 5m
        alertname: CICoordinatorTargetsAbsent
        exp_alerts:
          - exp_labels:
              job: ci-coordinator
              service: ci-coordinator
              severity: warning
            exp_annotations:
              summary: No CI Coordinator scrape target is present
              runbook: docs/how-to/operate-production-observability.md
      - eval_time: 10m
        alertname: CICoordinatorScrapeFailed
        exp_alerts: []
      - eval_time: 10m
        alertname: CICoordinatorReadinessTelemetryAbsent
        exp_alerts: []

  - name: mixed replicas retain their own failure identities
    interval: 1m
    input_series:
      - series: 'up{job="ci-coordinator",instance="healthy:3000"}'
        values: '1+0x15'
      - series: 'ci_coordinator_ready{job="ci-coordinator",instance="healthy:3000"}'
        values: '1+0x15'
      - series: 'up{job="ci-coordinator",instance="down:3000"}'
        values: '0+0x15'
      - series: 'up{job="ci-coordinator",instance="missing:3000"}'
        values: '1+0x15'
      - series: 'ci_coordinator_ready{job="unrelated",instance="missing:3000"}'
        values: '1+0x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: CICoordinatorTargetsAbsent
        exp_alerts: []
      - eval_time: 4m30s
        alertname: CICoordinatorScrapeFailed
        exp_alerts: []
      - eval_time: 4m30s
        alertname: CICoordinatorReadinessTelemetryAbsent
        exp_alerts: []
      - eval_time: 5m
        alertname: CICoordinatorScrapeFailed
        exp_alerts:
          - exp_labels: &down_labels
              instance: down:3000
              job: ci-coordinator
              service: ci-coordinator
              severity: warning
            exp_annotations: &down_annotations
              summary: A CI Coordinator target cannot be scraped
              runbook: docs/how-to/operate-production-observability.md
      - eval_time: 5m
        alertname: CICoordinatorReadinessTelemetryAbsent
        exp_alerts:
          - exp_labels:
              instance: missing:3000
              job: ci-coordinator
              service: ci-coordinator
              severity: warning
            exp_annotations:
              summary: A scraped CI Coordinator target has no readiness telemetry
              runbook: docs/how-to/operate-production-observability.md

  - name: scrape recovery respects the bounded keep-firing interval
    interval: 1m
    input_series:
      - series: 'up{job="ci-coordinator",instance="down:3000"}'
        values: '0+0x6 1+0x8'
      - series: 'ci_coordinator_ready{job="ci-coordinator",instance="down:3000"}'
        values: '1+0x15'
    alert_rule_test:
      - eval_time: 6m
        alertname: CICoordinatorScrapeFailed
        exp_alerts:
          - exp_labels: *down_labels
            exp_annotations: *down_annotations
      - eval_time: 11m
        alertname: CICoordinatorScrapeFailed
        exp_alerts:
          - exp_labels: *down_labels
            exp_annotations: *down_annotations
      - eval_time: 13m
        alertname: CICoordinatorScrapeFailed
        exp_alerts: []

  - name: unsafe omission alone fires across target counters and retains its bounded hold
    interval: 1m
    input_series:
      - series: 'ci_coordinator_shadow_unsafe_omissions_total{job="ci-coordinator",instance="failed"}'
        values: '0 1+0x25'
      - series: 'ci_coordinator_shadow_unsafe_omissions_total{job="ci-coordinator",instance="healthy"}'
        values: '0+0x26'
      - series: 'ci_coordinator_shadow_replay_mismatches_total'
        values: '0+0x26'
    alert_rule_test:
      - eval_time: 1m
        alertname: CIUnsafeOmissionObserved
        exp_alerts: &unsafe_alert
          - exp_labels:
              service: ci-coordinator
              severity: critical
            exp_annotations:
              summary: Unsafe CI omission evidence was observed
              runbook: docs/how-to/operate-production-observability.md
      - eval_time: 19m
        alertname: CIUnsafeOmissionObserved
        exp_alerts: *unsafe_alert
      - eval_time: 21m
        alertname: CIUnsafeOmissionObserved
        exp_alerts: []
      - eval_time: 5m
        alertname: CIReplayMismatchObserved
        exp_alerts: []

  - name: replay mismatch alone fires and then clears after window and hold
    interval: 1m
    input_series:
      - series: 'ci_coordinator_shadow_replay_mismatches_total{instance="failed"}'
        values: '0 1+0x25'
      - series: 'ci_coordinator_shadow_replay_mismatches_total{instance="healthy"}'
        values: '0+0x26'
      - series: 'ci_coordinator_shadow_unsafe_omissions_total'
        values: '0+0x26'
    alert_rule_test:
      - eval_time: 1m
        alertname: CIReplayMismatchObserved
        exp_alerts: &replay_alert
          - exp_labels:
              service: ci-coordinator
              severity: critical
            exp_annotations:
              summary: CI shadow replay evidence diverged
              runbook: docs/how-to/operate-production-observability.md
      - eval_time: 19m
        alertname: CIReplayMismatchObserved
        exp_alerts: *replay_alert
      - eval_time: 21m
        alertname: CIReplayMismatchObserved
        exp_alerts: []
      - eval_time: 5m
        alertname: CIUnsafeOmissionObserved
        exp_alerts: []

  - name: nonzero stationary safety counters and restart alone are not new violations
    interval: 1m
    input_series:
      - series: ci_coordinator_shadow_unsafe_omissions_total
        values: '7+0x5 0+0x20'
      - series: ci_coordinator_shadow_replay_mismatches_total
        values: '9+0x5 0+0x20'
    alert_rule_test:
      - eval_time: 5m
        alertname: CIUnsafeOmissionObserved
        exp_alerts: []
      - eval_time: 10m
        alertname: CIUnsafeOmissionObserved
        exp_alerts: []
      - eval_time: 5m
        alertname: CIReplayMismatchObserved
        exp_alerts: []
      - eval_time: 10m
        alertname: CIReplayMismatchObserved
        exp_alerts: []

  - name: missing safety gauges and counters do not fabricate incidents
    interval: 1m
    alert_rule_test:
      - eval_time: 10m
        alertname: CIUnsafeOmissionObserved
        exp_alerts: []
      - eval_time: 10m
        alertname: CIReplayMismatchObserved
        exp_alerts: []
      - eval_time: 10m
        alertname: CIReconciliationTerminalFailure
        exp_alerts: []
      - eval_time: 10m
        alertname: CICoordinatorNotReady
        exp_alerts: []

  - name: one terminal replica pages the service without leaking target labels
    interval: 30s
    input_series:
      - series: 'ci_coordinator_reconciliation_background_terminal_failure{job="ci-coordinator",instance="failed"}'
        values: '1+0x4 0+0x40'
      - series: 'ci_coordinator_reconciliation_background_terminal_failure{job="ci-coordinator",instance="healthy"}'
        values: '0+0x45'
    alert_rule_test:
      - eval_time: 30s
        alertname: CIReconciliationTerminalFailure
        exp_alerts: []
      - eval_time: 1m
        alertname: CIReconciliationTerminalFailure
        exp_alerts: &terminal_alert
          - exp_labels:
              service: ci-coordinator
              severity: page
            exp_annotations:
              summary: CI reconciliation stopped after a terminal failure
              runbook: docs/how-to/operate-production-observability.md
      - eval_time: 17m
        alertname: CIReconciliationTerminalFailure
        exp_alerts: *terminal_alert
      - eval_time: 18m
        alertname: CIReconciliationTerminalFailure
        exp_alerts: []

  - name: terminal replica handoff does not restart the service pending timer
    interval: 30s
    input_series:
      - series: 'ci_coordinator_reconciliation_background_terminal_failure{instance="a"}'
        values: '1 0+0x5'
      - series: 'ci_coordinator_reconciliation_background_terminal_failure{instance="b"}'
        values: '0 1+0x5'
    alert_rule_test:
      - eval_time: 1m
        alertname: CIReconciliationTerminalFailure
        exp_alerts: *terminal_alert

  - name: terminal transient shorter than one minute never fires
    interval: 30s
    input_series:
      - series: ci_coordinator_reconciliation_background_terminal_failure
        values: '1 0+0x40'
    alert_rule_test:
      - eval_time: 1m
        alertname: CIReconciliationTerminalFailure
        exp_alerts: []
      - eval_time: 10m
        alertname: CIReconciliationTerminalFailure
        exp_alerts: []

  - name: readiness preserves per-target identity pending period and recovery hold
    interval: 30s
    input_series:
      - series: 'ci_coordinator_ready{job="ci-coordinator",instance="not-ready"}'
        values: '0+0x12 1+0x16'
      - series: 'ci_coordinator_ready{job="ci-coordinator",instance="ready"}'
        values: '1+0x29'
    alert_rule_test:
      - eval_time: 4m30s
        alertname: CICoordinatorNotReady
        exp_alerts: []
      - eval_time: 5m
        alertname: CICoordinatorNotReady
        exp_alerts: &not_ready_alert
          - exp_labels:
              instance: not-ready
              job: ci-coordinator
              service: ci-coordinator
              severity: warning
            exp_annotations:
              summary: A CI Coordinator replica is not ready
              runbook: docs/how-to/operate-production-observability.md
      - eval_time: 11m
        alertname: CICoordinatorNotReady
        exp_alerts: *not_ready_alert
      - eval_time: 12m
        alertname: CICoordinatorNotReady
        exp_alerts: []

  - name: readiness transient below five minutes is not a warning
    interval: 30s
    input_series:
      - series: ci_coordinator_ready
        values: '0+0x8 1+0x20'
    alert_rule_test:
      - eval_time: 5m
        alertname: CICoordinatorNotReady
        exp_alerts: []
      - eval_time: 10m
        alertname: CICoordinatorNotReady
        exp_alerts: []

  - name: availability dependency failures cross both windows and exact pending periods
    interval: 1m
    input_series:
      - series: 'ci_coordinator_plan_requests_total{result="issued",instance="healthy"}'
        values: '0+98x430'
      - series: 'ci_coordinator_plan_requests_total{result="dependency_unavailable",instance="failed"}'
        values: '0+2x430'
    alert_rule_test:
      - eval_time: 2m30s
        alertname: CIPlanAvailabilityFastBurn
        exp_alerts: []
      - eval_time: 3m
        alertname: CIPlanAvailabilityFastBurn
        exp_alerts: &availability_fast_alert
          - exp_labels:
              service: ci-coordinator
              severity: page
            exp_annotations:
              summary: CI plan availability is consuming its error budget rapidly
              runbook: docs/how-to/operate-production-observability.md
      - eval_time: 15m30s
        alertname: CIPlanAvailabilitySlowBurn
        exp_alerts: []
      - eval_time: 16m
        alertname: CIPlanAvailabilitySlowBurn
        exp_alerts: &availability_slow_alert
          - exp_labels:
              service: ci-coordinator
              severity: ticket
            exp_annotations:
              summary: CI plan availability is consuming its error budget steadily
              runbook: docs/how-to/operate-production-observability.md
      - eval_time: 7h
        alertname: CIPlanAvailabilityFastBurn
        exp_alerts: *availability_fast_alert
      - eval_time: 7h
        alertname: CIPlanAvailabilitySlowBurn
        exp_alerts: *availability_slow_alert

  - name: issuance failures alone are eligible and cannot be diluted by rejected requests
    interval: 1m
    input_series:
      - series: 'ci_coordinator_plan_requests_total{result="issuance_unavailable"}'
        values: '0+100x430'
      - series: 'ci_coordinator_plan_requests_total{result="invalid"}'
        values: '0+100000x430'
      - series: 'ci_coordinator_plan_requests_total{result="unauthenticated"}'
        values: '0+100000x430'
      - series: 'ci_coordinator_plan_requests_total{result="forbidden"}'
        values: '0+100000x430'
      - series: 'ci_coordinator_plan_requests_total{result="conflict"}'
        values: '0+100000x430'
    alert_rule_test:
      - eval_time: 7h
        alertname: CIPlanAvailabilityFastBurn
        exp_alerts: *availability_fast_alert
      - eval_time: 7h
        alertname: CIPlanAvailabilitySlowBurn
        exp_alerts: *availability_slow_alert

  - name: issued requests alone are not service availability failures
    interval: 1m
    input_series:
      - series: 'ci_coordinator_plan_requests_total{result="issued"}'
        values: '0+100x430'
    alert_rule_test:
      - eval_time: 7h
        alertname: CIPlanAvailabilityFastBurn
        exp_alerts: []
      - eval_time: 7h
        alertname: CIPlanAvailabilitySlowBurn
        exp_alerts: []

  - name: rejected requests cannot satisfy the eligible volume guard
    interval: 1m
    input_series:
      - series: 'ci_coordinator_plan_requests_total{result="dependency_unavailable"}'
        values: '0+2x430'
      - series: 'ci_coordinator_plan_requests_total{result="invalid"}'
        values: '0+1000x430'
      - series: 'ci_coordinator_plan_requests_total{result="unauthenticated"}'
        values: '0+1000x430'
      - series: 'ci_coordinator_plan_requests_total{result="forbidden"}'
        values: '0+1000x430'
      - series: 'ci_coordinator_plan_requests_total{result="conflict"}'
        values: '0+1000x430'
    alert_rule_test:
      - eval_time: 7h
        alertname: CIPlanAvailabilityFastBurn
        exp_alerts: []
      - eval_time: 7h
        alertname: CIPlanAvailabilitySlowBurn
        exp_alerts: []

  - name: fast availability admits exactly twenty eligible requests in five minutes
    interval: 1m
    input_series:
      - series: 'ci_coordinator_plan_requests_total{result="issuance_unavailable"}'
        values: '0+4x65'
    alert_rule_test:
      - eval_time: 60m
        alertname: CIPlanAvailabilityFastBurn
        exp_alerts: *availability_fast_alert

  - name: slow availability admits exactly one hundred eligible requests in thirty minutes
    interval: 3m
    input_series:
      - series: 'ci_coordinator_plan_requests_total{result="issuance_unavailable"}'
        values: '0+10x145'
    alert_rule_test:
      - eval_time: 7h
        alertname: CIPlanAvailabilitySlowBurn
        exp_alerts: *availability_slow_alert

  - name: short fast availability burn alone is insufficient
    interval: 1m
    input_series:
      - series: 'ci_coordinator_plan_requests_total{result="issued"}'
        values: '0+10000x60 600000+98x10'
      - series: 'ci_coordinator_plan_requests_total{result="dependency_unavailable"}'
        values: '0+0x60 0+2x10'
    alert_rule_test:
      - eval_time: 70m
        alertname: CIPlanAvailabilityFastBurn
        exp_alerts: []

  - name: long fast availability burn alone clears after the short window and hold
    interval: 1m
    input_series:
