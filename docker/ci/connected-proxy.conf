events {}
http {
    access_log off;
    error_log /dev/stderr crit;
    resolver 127.0.0.11 valid=5s ipv6=off;
    ssl_certificate /fixture/tls.pem;
    ssl_certificate_key /fixture/tls-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server {
        listen 443 ssl default_server;
        server_name _;
        return 444;
    }
    server {
        listen 443 ssl;
        server_name auth.example.test;
        location / {
            set $identity keycloak;
            proxy_pass http://$identity:8080;
            proxy_set_header Host auth.example.test;
            proxy_set_header X-Forwarded-Host auth.example.test;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;
        }
    }
    server {
        listen 443 ssl;
        server_name coordinator.test;
        location / {
            set $application backend;
            proxy_pass http://$application:3000;
            proxy_set_header Host coordinator.test;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
