[[allowlists]]
description = "Public compact Proofkit witnessIdSuffix identifier in its owner route; not authentication material."
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
paths = ['''^proofkit/routes/developer\-environment\.v2\.json$''']
regexes = ['''^dev004\-secret\-falsifiers$''']

[[allowlists]]
description = "Synthetic cache placeholder in the exact upstream Grype database-status fixture; not a workstation path."
targetRules = ["workstation-home-path"]
condition = "AND"
regexTarget = "secret"
paths = ['''^scripts/tests/test_release_grype_db_status\.json$''']
regexes = ['''^\/Users\/test\/$''']
