title = "CI assurance secret policy"

[extend]
useDefault = true

[[allowlists]]
description = "Public cryptography type annotation in audit checkpoint fixtures; not key material."
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
paths = ['''^backend/tests/unit/audit_replay/test_checkpoint\.py$''']
regexes = ['''^Ed25519PrivateKey$''']

[[allowlists]]
description = "Public cryptography type annotation in capacity signing fixtures; not key material."
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
paths = ['''^backend/tests/unit/capacity_qualification/_support\.py$''']
regexes = ['''^Ed25519PrivateKey$''']

[[allowlists]]
description = "Public cryptography type annotations in cutover fixture fields and arguments; not key material."
