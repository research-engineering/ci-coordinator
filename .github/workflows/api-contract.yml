name: API Contract Campaign

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Generation budget"
        type: choice
        options: [fast, deep]
        default: fast
      seed:
        description: "Reproduction seed (0..4294967295)"
        type: string
        default: "20260919"
  workflow_call:
    inputs:
      profile:
        type: string
        default: deep
      seed:
        type: string
        default: "20260919"

permissions:
  contents: read

concurrency:
  group: api-contract-${{ github.workflow }}-${{ github.ref }}-${{ inputs.profile }}
  cancel-in-progress: true

jobs:
  api-contract:
    name: Isolated API contract campaign
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          prune-cache: true
      - name: Install locked Python dependencies
        run: |
          python3 -m scripts.python_witness lock-check
          python3 -m scripts.python_witness install-check
      - name: Run the isolated campaign
        env:
          API_PROFILE: ${{ inputs.profile }}
          API_SEED: ${{ inputs.seed }}
        run: backend/.venv/bin/python -m scripts.api_contract_campaign --seed "$API_SEED" -- "$API_PROFILE"
      - name: Retain API contract diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-contract-exploration
          path: .api-contract
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
