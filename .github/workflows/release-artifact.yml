name: Release Artifact

on:
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: release-artifact-${{ github.repository_id }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Admit source and Full Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read # Query the exact successful Full Check run.
      contents: read # Check out and bind the exact release source.
    outputs:
      repository: ${{ steps.publisher.outputs.repository }}
      image: ${{ steps.publisher.outputs.image }}
      signer_workflow: ${{ steps.publisher.outputs.signer_workflow }}
      repair_predicate: ${{ steps.publisher.outputs.repair_predicate }}
      gate_run_attempt: ${{ steps.identity.outputs.gate_run_attempt }}
      gate_run_id: ${{ steps.identity.outputs.gate_run_id }}
      release_identity: ${{ steps.identity.outputs.release_identity }}
      source_commit: ${{ steps.identity.outputs.source_commit }}
    steps:
      - name: Check out the exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up the release identity interpreter
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"
      - name: Load source-owned publisher identity
        id: publisher
        env:
          CI_COORDINATOR_RELEASE_REPOSITORY_ID: ${{ vars.CI_COORDINATOR_RELEASE_REPOSITORY_ID }}
          CI_COORDINATOR_FULL_CHECK_WORKFLOW_ID: ${{ vars.CI_COORDINATOR_FULL_CHECK_WORKFLOW_ID }}
        run: |
          set -euo pipefail
          python3 -m scripts.release_publisher_identity >> "${GITHUB_OUTPUT}"
      - name: Admit the immutable repository and event context
        env:
          ACTUAL_EVENT: ${{ github.event_name }}
          ACTUAL_REF: ${{ github.ref }}
          ACTUAL_REPOSITORY: ${{ github.repository }}
          ACTUAL_REPOSITORY_ID: ${{ github.repository_id }}
          ACTUAL_SHA: ${{ github.sha }}
          ACTUAL_WORKFLOW_REF: ${{ github.workflow_ref }}
          ACTUAL_WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXPECTED_REPOSITORY: ${{ steps.publisher.outputs.repository }}
          EXPECTED_REPOSITORY_ID: ${{ steps.publisher.outputs.repository_id }}
          EXPECTED_WORKFLOW_REF: ${{ steps.publisher.outputs.workflow_ref }}
        run: |
          set -euo pipefail
          test "${ACTUAL_EVENT}" = "workflow_dispatch"
          test "${ACTUAL_REF}" = "refs/heads/master"
          test "${ACTUAL_REPOSITORY}" = "${EXPECTED_REPOSITORY}"
          test "${ACTUAL_REPOSITORY_ID}" = "${EXPECTED_REPOSITORY_ID}"
          [[ "${ACTUAL_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "${ACTUAL_WORKFLOW_REF}" = "${EXPECTED_WORKFLOW_REF}"
          test "${ACTUAL_WORKFLOW_SHA}" = "${ACTUAL_SHA}"
          test "$(git rev-parse HEAD)" = "${ACTUAL_SHA}"
      - name: Resolve the exact successful Full Check
        id: identity
        env:
          GATE_WORKFLOW_ID: ${{ steps.publisher.outputs.gate_workflow_id }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ steps.publisher.outputs.repository }}
          REPOSITORY_ID: ${{ steps.publisher.outputs.repository_id }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          response="${RUNNER_TEMP}/full-check-runs.json"
          gh api --method GET \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/${REPOSITORY}/actions/workflows/${GATE_WORKFLOW_ID}/runs" \
            --raw-field branch=master \
            --raw-field event=workflow_dispatch \
            --raw-field head_sha="${SOURCE_COMMIT}" \
            --raw-field per_page=10 \
            --raw-field status=success \
            > "${response}"
          python3 -m scripts.release_artifact_identity \
            --gate-response "${response}" \
            --repository "${REPOSITORY}" \
            --repository-id "${REPOSITORY_ID}" \
            --source-commit "${SOURCE_COMMIT}" \
            --source-ref refs/heads/master \
            --gate-workflow-id "${GATE_WORKFLOW_ID}" \
            --gate-workflow-name "Full Check" \
            --gate-workflow-path .github/workflows/python-persistence.yml \
            --release-event workflow_dispatch \
            --release-workflow-path .github/workflows/release-artifact.yml \
            --release-run-id "${RELEASE_RUN_ID}" \
            --release-run-attempt "${RELEASE_RUN_ATTEMPT}" \
            >> "${GITHUB_OUTPUT}"

  build:
    name: Build and publish immutable image
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read # Check out the admitted source without persisted credentials.
      packages: write # Push the newly built image to this repository's GHCR package.
    outputs:
      artifact_digest: ${{ steps.build.outputs.digest }}
      provenance_sha256: ${{ steps.predicates.outputs.provenance_sha256 }}
      sbom_sha256: ${{ steps.predicates.outputs.sbom_sha256 }}
      vulnerability_evidence_sha256: ${{ steps.vulnerability.outputs.vulnerability_evidence_sha256 }}
      repair_evidence_sha256: ${{ steps.vulnerability.outputs.repair_evidence_sha256 }}
    env:
      DOCKER_BUILD_RECORD_UPLOAD: "false"
      IMAGE_NAME: ${{ needs.preflight.outputs.image }}
    steps:
      - name: Check out admitted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ needs.preflight.outputs.source_commit }}
      - name: Set up the predicate validator interpreter
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"
      - name: Set up the locked dependency installer
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
          version: "0.12.17"
      - name: Set up pinned Buildx and BuildKit
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false
          driver-opts: image=moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3
          version: v0.37.1
      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          password: ${{ github.token }}
          registry: ghcr.io
          username: ${{ github.actor }}
      - name: Build and publish by unique discovery tag
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          build-args: |
            CI_COORDINATOR_PRODUCTION_BUILD=true
            CI_COORDINATOR_RELEASE_ID=${{ needs.preflight.outputs.release_identity }}
            CI_COORDINATOR_SOURCE_COMMIT=${{ needs.preflight.outputs.source_commit }}
          context: .
          file: Dockerfile
          github-token: ""
          labels: |
            org.opencontainers.image.revision=${{ needs.preflight.outputs.source_commit }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=CI Coordinator
            org.opencontainers.image.version=${{ needs.preflight.outputs.release_identity }}
          platforms: linux/amd64
          provenance: mode=max,version=v1
          pull: true
          push: true
          sbom: true
          tags: ${{ env.IMAGE_NAME }}:run-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Download and verify pinned Grype release
        env:
          GRYPE_RELEASE_SHA256: 3fa2dc4b924621ab65404cf08d0b8438d896d80ab949c9d5a4ca283c36004c9b
          GRYPE_RELEASE_URL: https://github.com/anchore/grype/releases/download/v0.119.0/grype_0.119.0_linux_amd64.tar.gz
          GRYPE_VERSION: 0.119.0
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/grype-${GRYPE_VERSION}.tar.gz"
          install_root="${RUNNER_TEMP}/grype-${GRYPE_VERSION}"
          mkdir -p "${install_root}"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "${archive}" \
            "${GRYPE_RELEASE_URL}"
          printf '%s  %s\n' "${GRYPE_RELEASE_SHA256}" "${archive}" \
            | sha256sum --check --strict
          tar --extract --file "${archive}" --directory "${install_root}" grype
          test -x "${install_root}/grype"
          {
            printf 'GRYPE_BIN=%s\n' "${install_root}/grype"
            printf 'GRYPE_BINARY_SHA256=%s\n' \
              "$(sha256sum "${install_root}/grype" | cut -d ' ' -f 1)"
            printf 'GRYPE_RELEASE_SHA256=%s\n' "${GRYPE_RELEASE_SHA256}"
            printf 'GRYPE_RELEASE_URL=%s\n' "${GRYPE_RELEASE_URL}"
            printf 'GRYPE_VERSION=%s\n' "${GRYPE_VERSION}"
          } >> "${GITHUB_ENV}"
      - name: Provision the independent locked predicate validator
        run: |
          set -euo pipefail
          uv sync \
            --project backend \
            --frozen \
            --no-dev \
            --no-install-project
      - name: Collect exact runtime repair evidence
        env:
          ARTIFACT_DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_COMMIT: ${{ needs.preflight.outputs.source_commit }}
        run: |
          set -euo pipefail
          [[ "${ARTIFACT_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          PYTHONPATH=backend/src backend/.venv/bin/python -m scripts.release_repair_evidence \
            --subject "${IMAGE_NAME}@${ARTIFACT_DIGEST}" --source-commit "${SOURCE_COMMIT}" \
            --policy docker/runtime/security/repaired-matches.v1.json \
            --output "${RUNNER_TEMP}/release-runtime-repairs.json"
      - name: Admit final-image vulnerability evidence
        id: vulnerability
        env:
          ARTIFACT_DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_COMMIT: ${{ needs.preflight.outputs.source_commit }}
        run: |
          set -euo pipefail
          [[ "${ARTIFACT_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          artifact="${IMAGE_NAME}@${ARTIFACT_DIGEST}"
          repair_evidence="${RUNNER_TEMP}/release-runtime-repairs.json"
          scan_report="${RUNNER_TEMP}/release-vulnerability-scan.json"
          database_status="${RUNNER_TEMP}/grype-db-status.json"
          manifest_inspection="${RUNNER_TEMP}/registry-manifest.json"
          evidence="${RUNNER_TEMP}/release-vulnerability-evidence.json"
          grype_config="${RUNNER_TEMP}/release-grype.json"
          grype_cache="${RUNNER_TEMP}/release-grype-db"
          backend/.venv/bin/python -c 'import json, sys; json.dump({
            "db": {
              "cache-dir": sys.argv[1],
              "update-url": "https://grype.anchore.io/databases/v6/latest.json",
              "auto-update": False,
              "validate-age": True,
              "validate-by-hash-on-start": True,
              "require-update-check": True,
              "max-allowed-built-age": "24h"
            },
            "check-for-app-update": False,
            "only-fixed": False,
            "only-notfixed": False,
            "ignore-wontfix": "",
            "match-upstream-kernel-headers": True,
            "ignore": [], "exclude": [], "vex-documents": [], "vex-add": [],
            "distro": ""
          }, sys.stdout)' "${grype_cache}" > "${grype_config}"
          run_grype() {
            env -i HOME="${HOME}" PATH="${PATH}" \
              DOCKER_CONFIG="${DOCKER_CONFIG:-${HOME}/.docker}" TMPDIR="${RUNNER_TEMP}" \
              "${GRYPE_BIN}" -c "${grype_config}" "$@"
          }
          set +e
          docker buildx imagetools inspect "${artifact}" \
            --format '{{json .Manifest}}' \
            > "${manifest_inspection}"
          manifest_exit_code=$?
          if test "${manifest_exit_code}" -ne 0; then
            : > "${manifest_inspection}"
          fi
          run_grype db update \
            > "${RUNNER_TEMP}/grype-db-update.log" 2>&1
          database_update_exit_code=$?
          run_grype db status \
            --output json \
            > "${database_status}" 2> "${RUNNER_TEMP}/grype-db-status.log"
          database_status_exit_code=$?
          run_grype "${artifact}" \
            --from registry \
            --platform linux/amd64 \
            --scope squashed \
            --output json \
            --fail-on high \
            > "${scan_report}" 2> "${RUNNER_TEMP}/grype-scan.log"
          scanner_exit_code=$?
          set -e
          observed_at="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          backend/.venv/bin/python -m scripts.release_vulnerability_admission \
            --policy docs/specs/ci-coordinator-release/vulnerability-gate-policy.v1.json \
            --repair-policy docker/runtime/security/repaired-matches.v1.json \
            --repair-evidence "${repair_evidence}" \
            --source-commit "${SOURCE_COMMIT}" \
            --scan-report "${scan_report}" \
            --database-status "${database_status}" \
            --manifest-inspection "${manifest_inspection}" \
            --evidence-output "${evidence}" \
            --subject "${artifact}" \
            --platform linux/amd64 \
            --scanner-name grype \
            --scanner-version "${GRYPE_VERSION}" \
            --scanner-release-url "${GRYPE_RELEASE_URL}" \
            --scanner-release-sha256 "${GRYPE_RELEASE_SHA256}" \
            --scanner-binary-sha256 "${GRYPE_BINARY_SHA256}" \
            --scanner-exit-code "${scanner_exit_code}" \
            --database-update-exit-code "${database_update_exit_code}" \
            --database-status-exit-code "${database_status_exit_code}" \
            --expected-db-cache-dir "${grype_cache}" \
            --observed-at "${observed_at}" \
            >> "${GITHUB_OUTPUT}"
      - name: Upload bounded vulnerability evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: release-vulnerability-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-vulnerability-evidence.json
          retention-days: 7
      - name: Upload admitted runtime repair evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: release-repairs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-runtime-repairs.json
          retention-days: 7
      - name: Validate registry predicates without signing authority
        id: predicates
        env:
          ARTIFACT_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "${ARTIFACT_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          artifact="${IMAGE_NAME}@${ARTIFACT_DIGEST}"
          docker pull "${artifact}" > /dev/null
          docker buildx imagetools inspect "${artifact}" \
            --format '{{json .Provenance.SLSA}}' \
            > "${RUNNER_TEMP}/provenance.slsa.json"
          docker buildx imagetools inspect "${artifact}" \
            --format '{{json .SBOM.SPDX}}' \
            > "${RUNNER_TEMP}/sbom.spdx.json"
          backend/.venv/bin/python -m scripts.release_predicate_admission \
            --provenance "${RUNNER_TEMP}/provenance.slsa.json" \
            --sbom "${RUNNER_TEMP}/sbom.spdx.json" \
            --schema-directory docs/specs/ci-coordinator-release \
            >> "${GITHUB_OUTPUT}"

  attest:
    name: Attest and independently verify image
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read # Download the exact build-gate evidence artifact.
      artifact-metadata: write # Link the verified digest to organization artifact metadata.
      attestations: write # Persist provenance and SBOM attestations.
      contents: read # Bind attestation identity to the exact repository source.
      id-token: write # Mint the short-lived Sigstore signing certificate.
      packages: write # Publish attestations beside the exact GHCR digest.
    env:
      ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact_digest }}
      IMAGE_NAME: ${{ needs.preflight.outputs.image }}
      REPOSITORY: ${{ needs.preflight.outputs.repository }}
      REPAIR_PREDICATE: ${{ needs.preflight.outputs.repair_predicate }}
      SIGNER_WORKFLOW: ${{ needs.preflight.outputs.signer_workflow }}
      PROVENANCE_SHA256: ${{ needs.build.outputs.provenance_sha256 }}
      RELEASE_IDENTITY: ${{ needs.preflight.outputs.release_identity }}
      SBOM_SHA256: ${{ needs.build.outputs.sbom_sha256 }}
      SOURCE_COMMIT: ${{ needs.preflight.outputs.source_commit }}
      VULNERABILITY_ARTIFACT_NAME: release-vulnerability-${{ github.run_id }}-${{ github.run_attempt }}
      VULNERABILITY_EVIDENCE_SHA256: ${{ needs.build.outputs.vulnerability_evidence_sha256 }}
      REPAIR_EVIDENCE_SHA256: ${{ needs.build.outputs.repair_evidence_sha256 }}
    steps:
      - name: Set up pinned Buildx and BuildKit
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false
          driver-opts: image=moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3
          version: v0.37.1
      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          password: ${{ github.token }}
          registry: ghcr.io
          username: ${{ github.actor }}
      - name: Download exact vulnerability evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.VULNERABILITY_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/vulnerability-evidence
      - name: Download exact runtime repair evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-repairs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/repair-evidence
      - name: Pull by registry digest and inspect without execution
        run: |
          set -euo pipefail
          [[ "${ARTIFACT_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          artifact="${IMAGE_NAME}@${ARTIFACT_DIGEST}"
          evidence="${RUNNER_TEMP}/vulnerability-evidence/release-vulnerability-evidence.json"
          test -f "${evidence}"
          [[ "${VULNERABILITY_EVIDENCE_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          test \
            "$(sha256sum "${evidence}" | cut -d ' ' -f 1)" \
            = "${VULNERABILITY_EVIDENCE_SHA256}"
          repairs="${RUNNER_TEMP}/repair-evidence/release-runtime-repairs.json"
          test -f "${repairs}"
          [[ "${REPAIR_EVIDENCE_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          test "$(sha256sum "${repairs}" | cut -d ' ' -f 1)" = "${REPAIR_EVIDENCE_SHA256}"
          docker pull "${artifact}" > /dev/null

          container_id="$(docker create "${artifact}")"
          cleanup() {
            docker rm --force "${container_id}" > /dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker cp \
            "${container_id}:/app/backend/src/ci_coordinator/runtime_settings/resources/build-identity.v1.json" \
            "${RUNNER_TEMP}/build-identity.v1.json"
          cleanup
          trap - EXIT

          printf \
            '{"productionEligible":true,"releaseIdentity":"%s","schemaVersion":"ci-coordinator-build-identity/v1","sourceCommit":"%s"}\n' \
            "${RELEASE_IDENTITY}" \
            "${SOURCE_COMMIT}" \
            > "${RUNNER_TEMP}/expected-build-identity.v1.json"
          cmp \
            "${RUNNER_TEMP}/expected-build-identity.v1.json" \
            "${RUNNER_TEMP}/build-identity.v1.json"

          docker buildx imagetools inspect "${artifact}" \
            --format '{{json .Provenance.SLSA}}' \
            > "${RUNNER_TEMP}/provenance.slsa.json"

          docker buildx imagetools inspect "${artifact}" \
            --format '{{json .SBOM.SPDX}}' \
            > "${RUNNER_TEMP}/sbom.spdx.json"
          [[ "${PROVENANCE_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${SBOM_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          test \
            "$(sha256sum "${RUNNER_TEMP}/provenance.slsa.json" | cut -d ' ' -f 1)" \
            = "${PROVENANCE_SHA256}"
          test \
            "$(sha256sum "${RUNNER_TEMP}/sbom.spdx.json" | cut -d ' ' -f 1)" \
            = "${SBOM_SHA256}"
      - name: Attest GitHub build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          create-storage-record: true
          push-to-registry: true
          subject-digest: ${{ env.ARTIFACT_DIGEST }}
          subject-name: ${{ env.IMAGE_NAME }}
      - name: Attest the extracted SPDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          create-storage-record: false
          push-to-registry: true
          sbom-path: ${{ runner.temp }}/sbom.spdx.json
          subject-digest: ${{ env.ARTIFACT_DIGEST }}
          subject-name: ${{ env.IMAGE_NAME }}
      - name: Attest the admitted runtime repairs
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          create-storage-record: false
          push-to-registry: true
          predicate-type: ${{ env.REPAIR_PREDICATE }}
          predicate-path: ${{ runner.temp }}/repair-evidence/release-runtime-repairs.json
          subject-digest: ${{ env.ARTIFACT_DIGEST }}
          subject-name: ${{ env.IMAGE_NAME }}
      - name: Verify exact signer, source, provenance, and SBOM
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact="oci://${IMAGE_NAME}@${ARTIFACT_DIGEST}"
          common=(
            --deny-self-hosted-runners
            --repo "${REPOSITORY}"
            --signer-digest "${SOURCE_COMMIT}"
            --signer-workflow "${SIGNER_WORKFLOW}"
            --source-digest "${SOURCE_COMMIT}"
            --source-ref refs/heads/master
          )
          gh attestation verify "${artifact}" "${common[@]}" \
            --predicate-type https://slsa.dev/provenance/v1
          gh attestation verify "${artifact}" "${common[@]}" \
            --bundle-from-oci \
            --predicate-type https://slsa.dev/provenance/v1
          gh attestation verify "${artifact}" "${common[@]}" \
            --predicate-type https://spdx.dev/Document/v2.3
          gh attestation verify "${artifact}" "${common[@]}" \
            --bundle-from-oci \
            --predicate-type https://spdx.dev/Document/v2.3
          gh attestation verify "${artifact}" "${common[@]}" \
            --predicate-type "${REPAIR_PREDICATE}"
          gh attestation verify "${artifact}" "${common[@]}" \
            --bundle-from-oci \
            --predicate-type "${REPAIR_PREDICATE}"
