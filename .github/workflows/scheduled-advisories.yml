name: Scheduled Advisory Check

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: scheduled-advisories-${{ github.repository }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}/backend/src

jobs:
  packages:
    name: Advisory feeds (${{ matrix.scope }})
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scope: [python, npm, go]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          enable-cache: false
      - name: Install the locked receipt validator
        run: uv sync --frozen --project backend --python 3.13.15 --no-dev --no-install-project
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: matrix.scope == 'npm'
        with:
          version: "12.5.1"
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: matrix.scope == 'npm'
        with:
          node-version: "24.21.0"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.scope == 'go'
        with:
          go-version: "1.27.1"
          cache: false
      - name: Install the existing pinned Go analyzer
        if: matrix.scope == 'go'
        env:
          GOTOOLCHAIN: local
          GOBIN: ${{ runner.temp }}/ci-utility-bin
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          printf '%s\n' "$GOBIN" >> "$GITHUB_PATH"
      - name: Observe current advisory responses for locked inputs
        env:
          SCOPE: ${{ matrix.scope }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: >-
          backend/.venv/bin/python -m scripts.scheduled_advisories
          "$SCOPE" --source-commit "$SOURCE_COMMIT"
          --output "$RUNNER_TEMP/advisory-receipts/$SCOPE.json"
      - name: Retain bounded observation
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: advisory-${{ matrix.scope }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/advisory-receipts/*.json
          if-no-files-found: error
          retention-days: 7

  released-image:
    name: Latest released image advisory feed
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read # Discover the latest successful release workflow run.
      attestations: read # Verify the immutable release subject against GitHub attestations.
      contents: read
      packages: read # Read the released image and its OCI attestation bundles.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          enable-cache: false
      - name: Install the locked receipt validator
        run: uv sync --frozen --project backend --python 3.13.15 --no-dev --no-install-project
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.37.1
          cache-binary: false
          driver-opts: image=moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Install the exact attestation JSON reader
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gh.tar.gz"
          curl --silent --show-error --fail --location --proto '=https' --proto-redir '=https' \
            --tlsv1.2 --max-time 120 --max-filesize 67108864 \
            --output "$archive" \
            https://github.com/cli/cli/releases/download/v2.101.0/gh_2.101.0_linux_amd64.tar.gz
          printf '%s  %s\n' \
            9bca2d1c16825f109907a23307628a2f0698fbf99662b73a5cf0b020293072b8 \
            "$archive" | sha256sum --check --strict
          tar --extract --file "$archive" --directory "$RUNNER_TEMP" gh_2.101.0_linux_amd64/bin/gh
          printf '%s\n' "$RUNNER_TEMP/gh_2.101.0_linux_amd64/bin" >> "$GITHUB_PATH"
      - name: Discover, verify and scan the immutable released subject
        env:
          CI_COORDINATOR_RELEASE_REPOSITORY_ID: ${{ vars.CI_COORDINATOR_RELEASE_REPOSITORY_ID }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: >-
          backend/.venv/bin/python -m scripts.scheduled_advisories
          released-image --source-commit "$SOURCE_COMMIT"
          --output "$RUNNER_TEMP/advisory-receipts/released-image.json"
      - name: Retain bounded observation
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: advisory-released-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/advisory-receipts/*.json
          if-no-files-found: error
          retention-days: 7

  coverage:
    name: Advisory coverage and freshness
    if: always()
    needs: [packages, released-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Require all prerequisite jobs to complete successfully
        env:
          PACKAGES_RESULT: ${{ needs.packages.result }}
          RELEASED_IMAGE_RESULT: ${{ needs.released-image.result }}
        run: |
          set -euo pipefail
          test "$PACKAGES_RESULT" = success
          test "$RELEASED_IMAGE_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          enable-cache: false
      - name: Install the locked receipt validator
        run: uv sync --frozen --project backend --python 3.13.15 --no-dev --no-install-project
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: advisory-*-${{ github.run_id }}-${{ github.run_attempt }}
          merge-multiple: true
          path: ${{ runner.temp }}/advisory-receipts
      - name: Reject failed, missing or stale coverage
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: >-
          backend/.venv/bin/python -m scripts.scheduled_advisories
          summarize --source-commit "$SOURCE_COMMIT"
          --receipts "$RUNNER_TEMP/advisory-receipts"
          --output "$RUNNER_TEMP/advisory-summary.json"
