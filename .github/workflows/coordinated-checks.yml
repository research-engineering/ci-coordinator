  coordinated-checks-gate:
    name: Coordinated Checks
    needs:
    - connected-administrator
    - connected-development-stack
    - container-runtime-smoke
    - developer-bootstrap
    - developer-container
    - developer-host-lifecycle
    - native-test-plan
    - native-test-shards
    - operator-workbench
    - persistence-mutation
    - plan
    - postgres-witness
    - repository-quality
    - secret-scan
    - trusted-plan-request-entrypoint
    - trusted-requester-contract
    - utility-config
    - utility-docker
    - utility-go-static
    - utility-go-vulnerabilities
    - utility-spelling
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
    - name: Reject cancelled workflow
      if: ${{ cancelled() }}
      run: exit 1
    - name: Check out execution authority
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ job.workflow_sha }}
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 24.21.0
    - name: Admit exactly one successful execution path
      env:
        CI_PLAN_RESULT: ${{ needs.plan.result }}
        CI_PLAN_VALID: ${{ needs.plan.outputs.plan_valid }}
        CI_FALLBACK: ${{ needs.plan.outputs.fallback }}
        CI_SELECTED_JOBS_JSON: ${{ needs.plan.outputs.selected_jobs }}
        CI_STATIC_JOB_RESULTS_JSON: "{\"connected-administrator\":\"${{ needs['connected-administrator'].result }}\",\"connected-development-stack\":\"${{ needs['connected-development-stack'].result }}\",\"container-runtime-smoke\":\"${{ needs['container-runtime-smoke'].result }}\",\"developer-bootstrap\":\"${{ needs['developer-bootstrap'].result }}\",\"developer-container\":\"${{ needs['developer-container'].result }}\",\"developer-host-lifecycle\":\"${{ needs['developer-host-lifecycle'].result }}\",\"native-test-plan\":\"${{ needs['native-test-plan'].result }}\",\"native-test-shards\":\"${{ needs['native-test-shards'].result }}\",\"operator-workbench\":\"${{ needs['operator-workbench'].result }}\",\"persistence-mutation\":\"${{ needs['persistence-mutation'].result }}\",\"postgres-witness\":\"${{ needs['postgres-witness'].result }}\",\"repository-quality\":\"${{ needs['repository-quality'].result }}\",\"secret-scan\":\"${{ needs['secret-scan'].result }}\",\"trusted-plan-request-entrypoint\"\
          :\"${{ needs['trusted-plan-request-entrypoint'].result }}\",\"trusted-requester-contract\":\"${{ needs['trusted-requester-contract'].result }}\",\"utility-config\":\"${{ needs['utility-config'].result }}\",\"utility-docker\":\"${{ needs['utility-docker'].result }}\",\"utility-go-static\":\"${{ needs['utility-go-static'].result }}\",\"utility-go-vulnerabilities\":\"${{ needs['utility-go-vulnerabilities'].result }}\",\"utility-spelling\":\"${{ needs['utility-spelling'].result }}\"}"
        CI_TARGET_REGISTRY_PATH: .ci-coordinator/execution-registry.v1.json
        CI_OWNER: ${{ github.repository_owner }}
        CI_REPO: ${{ github.event.repository.name }}
        CI_WORKFLOW_PATH: .github/workflows/coordinated-checks.yml
        CI_WORKFLOW_REF: ${{ job.workflow_ref }}
      run: node .ci-coordinator/ci-coordinator.cjs validate-gate
