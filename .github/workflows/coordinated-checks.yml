  utility-go-static:
    name: Go static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
    - name: Check out complete input universe
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: 3.13.15
    - name: Set up locked package manager
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
      with:
        version: 0.12.17
        enable-cache: true
        cache-dependency-glob: tooling/quality/uv.lock
    - name: Install locked utility environment
      run: uv sync --locked --project tooling/quality --python 3.13.15 --no-dev
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version: 1.27.1
        cache-dependency-path: tooling/actionlint/go.sum
