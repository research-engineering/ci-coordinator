      working-directory: tooling/actionlint
      env:
        GOTOOLCHAIN: local
        GOWORK: "off"
      run: go mod download && go mod verify
    - name: Install pinned Go analyzer
      env:
        GOTOOLCHAIN: local
        GOBIN: ${{ runner.temp }}/ci-utility-bin
      run: "go install honnef.co/go/tools/cmd/staticcheck@v0.8.1\nprintf '%s\\n' \"$GOBIN\" >> \"$GITHUB_PATH\"\n"
